# Test profile – dùng H2 in-memory (không đụng MySQL thật)
spring.datasource.url=jdbc:h2:mem:quizzone_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

jwt.secret=test_secret_key_for_quizzone_testing_purposes_only_minimum_32chars
jwt.expiration=3600000

logging.level.com.gr2.quizzone=WARN
logging.level.org.springframework.security=WARN
