# ============================================================
# QuizZone Backend – Application Properties
# ============================================================

# Server
server.port=8080

# ── Database ────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/quizzone_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=true

# ── JWT ─────────────────────────────────────────────────────
# Thay secret bằng giá trị ngẫu nhiên dài ≥ 32 ký tự khi deploy production
jwt.secret=quizzone_super_secret_key_please_change_in_production_2024
jwt.expiration=604800000

# ── Swagger / OpenAPI ───────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ─────────────────────────────────────────────────
logging.level.com.gr2.quizzone=DEBUG
logging.level.org.springframework.security=WARN
